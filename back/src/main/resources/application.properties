spring.application.name=mdd-api

# Local settings: back/.env in development, environment variables in production
spring.config.import=optional:file:.env[.properties]

# JPA: Flyway owns the schema, Hibernate only checks it at startup
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT
mdd.jwt.secret=${JWT_SECRET}
mdd.jwt.expiration=24h

# Swagger UI: enabled by back/.env in development, off in production
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.csrf.enabled=true
