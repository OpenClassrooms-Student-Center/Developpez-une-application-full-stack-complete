<h2>Mot de passe</h2>
<form class="form" [formRoot]="passwordForm">
  <label for="currentPassword">Mot de passe actuel</label>
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <input
      matInput
      id="currentPassword"
      type="password"
      autocomplete="current-password"
      [formField]="passwordForm.currentPassword"
    />
    <mat-error>{{ passwordForm.currentPassword().errors()[0]?.message }}</mat-error>
  </mat-form-field>

  <label for="newPassword">Nouveau mot de passe</label>
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <input
      matInput
      id="newPassword"
      type="password"
      autocomplete="new-password"
      [formField]="passwordForm.newPassword"
    />
    <mat-error>{{ passwordForm.newPassword().errors()[0]?.message }}</mat-error>
  </mat-form-field>

  @if (failure()) {
    <p class="failure" role="alert">{{ failure() }}</p>
  }
  <button matButton="filled" type="submit" [disabled]="passwordForm().submitting()">
    Modifier
  </button>
</form>
